name: Azure production website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and verify Nuriek website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nuriek-website-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build production assets
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/staticwebapp.config.json
      - name: Deploy to Azure production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist
          skip_app_build: true
          skip_api_build: true
      - name: Verify the public Azure site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for attempt in {1..12}; do
            if curl --silent --show-error --fail --max-time 15 \
                 -H 'Cache-Control: no-cache' "https://www.nuriek.com/?deployment=${GITHUB_SHA}" \
                 --output "$RUNNER_TEMP/nuriek-index.html" &&
               cmp --silent client/dist/index.html "$RUNNER_TEMP/nuriek-index.html"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The public homepage did not match the Azure deployment."
          exit 1
